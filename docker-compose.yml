services:
  nextjs:
    build: .
    container_name: calendar_app
    ports:
      - "3000:3000"
    env_file:
      - .env.local # aquí puedes cambiar entre `.env.local` o `.env.production`
    restart: always
    networks:
      - localstack-net
       
networks:
  localstack-net:
    external: true